<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CNY ⇄ TWD 匯率</title>
<link rel="manifest" href="data:application/json;base64,eyJuYW1lIjoiQ15fVFREIOW8guS6p+W6lwIiLCJzaG9ydF9uYW1lIjoi5rCR5ouGIiLCJzdGFydF91cmwiOiIiLCJkaXNwbGF5Ijoic3RhbmRhbG9uZSIsImJhY2tncm91bmRfY29sb3IiOiIjMTIxNDE3IiwidGhlbWVfY29sb3IiOiIjMTIxNDE3In0=">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:#121417;
  color:#f0f0f0;
  font-family:"微軟正黑體",sans-serif;
  padding:20px;
  min-height:100vh;
}
.card{
  background:#1e2126;
  border-radius:18px;
  padding:22px;
  max-width:460px;
  margin:10px auto;
}
.rateBig{
  font-size:28px;
  font-weight:bold;
  margin-bottom:10px;
}
.infoText{
  font-size:15px;
  line-height:1.7;
  color:#cccccc;
  margin-bottom:18px;
}
#chartWrap{
  width:100%;
  height:260px;
}
.btnGroup{
  display:flex;
  gap:8px;
  margin:16px 0;
}
.periodBtn{
  flex:1;
  padding:10px;
  background:#323842;
  color:#ddd;
  border:0;
  border-radius:10px;
  font-size:15px;
}
.periodBtn.active{
  background:#48895b;
  color:#fff;
}
.btnRefresh{
  width:100%;
  padding:12px;
  background:#323842;
  color:#ffffff;
  border:0;
  border-radius:12px;
  font-size:16px;
}
.tipNote{
  font-size:13px;
  color:#888;
  margin-top:12px;
  text-align:center;
}
</style>
</head>
<body>
<div class="card">
<div class="rateBig">1 人民幣 ≈ 4.73 新台幣</div>
<div class="infoText">參考 Google 公開匯率，每日手動更新查看最新行情</div>

<div class="btnGroup">
<button class="periodBtn" data-day="7">1週</button>
<button class="periodBtn active" data-day="30">1個月</button>
<button class="periodBtn" data-day="365">1年</button>
</div>

<div id="chartWrap">
<canvas id="rateChart"></canvas>
</div>

<div class="tipNote">走勢圖範例（樣式參考Google匯率圖表）</div>
<button class="btnRefresh" onclick="alert('請至Google查詢最新匯率')">查詢最新匯率</button>
</div>

<script>
let chartObj=null;
let currentRange=30;

// 模擬不同區間範例數據
const sampleData={
  7:{label:["8/12","8/13","8/14","8/15","8/16","8/17","8/18"],data:[4.78,4.77,4.76,4.75,4.74,4.735,4.73]},
  30:{label:["7/20","7/26","8/1","8/6","8/10","8/14","8/18"],data:[4.79,4.785,4.792,4.77,4.755,4.74,4.73]},
  365:{label:["9月","11月","1月","3月","5月","7月","8月"],data:[4.82,4.80,4.76,4.77,4.78,4.76,4.73]}
};

async function drawChart(days){
  const set=sampleData[days];
  if(chartObj) chartObj.destroy();
  const ctx=document.getElementById("rateChart").getContext("2d");
  chartObj=new Chart(ctx,{
    type:"line",
    data:{
      labels:set.label,
      datasets:[{
        label:"CNY→TWD",
        data:set.data,
        borderColor:"#70c987",
        backgroundColor:"rgba(112,201,135,0.18)",
        fill:true,
        tension:0.3,
        pointRadius:0
      }]
    },
    options:{
      responsive:true,
      maintainAspectRatio:false,
      plugins:{legend:{display:false}},
      scales:{
        x:{grid:{display:false},ticks:{maxRotation:0,autoSkip:true,color:"#999"}},
        y:{grid:{color:"#2c3138"},ticks:{color:"#999"}}
      }
    }
  })
}

document.querySelectorAll(".periodBtn").forEach(btn=>{
  btn.onclick=async function(){
    document.querySelectorAll(".periodBtn").forEach(b=>b.classList.remove("active"));
    this.classList.add("active");
    currentRange=Number(this.dataset.day);
    await drawChart(currentRange);
  }
})

drawChart(30);
</script>
</body>
</html>
